<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>My ToDo</h1>
    <p id="completedCount">0 completed</p>

    <!-- add a new task -->
    <div class="add-task">
      <input type="text" id="taskInput">
      <button type="button" id="addButton">OK</button>
    </div>

    <!-- shows if input is empty -->
    <p id="message"></p>

    <!-- tasks go here -->
    <ul id="taskList"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
