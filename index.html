<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>ToDo</h1>

    <!-- add new task -->
    <div class="add-task">
      <input type="text" id="taskInput" placeholder="Skriv en uppgift">
      <button type="button" id="addButton">Lägg till</button>
    </div>

    <!-- shown by js when input is empty -->
    <p id="message" class="message" aria-live="polite"></p>

    <!-- tasks get added here -->
    <ul id="taskList"></ul>

    <p id="completedCount">Klart: 0</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
